<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Deck">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<title>Claude Deck · Anmelden</title>
<style>
  :root {
    color-scheme: light dark;
    --schrift: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --bg: #f2f2f7; --karte: #ffffff; --text: #000000; --leise: rgba(60,60,67,.6); --trenner: rgba(60,60,67,.18); --blau: #0071e3; --leer: #d70015;
    --feder: cubic-bezier(.32, .72, 0, 1);
    --glas: rgba(255,255,255,.55); --glas-oben: rgba(255,255,255,.9); --glas-rand: rgba(255,255,255,.6);
    --hintergrund: radial-gradient(60% 50% at 10% 6%, rgba(0,113,227,.2), transparent 70%), radial-gradient(50% 45% at 92% 10%, rgba(175,82,222,.18), transparent 70%), radial-gradient(60% 50% at 75% 96%, rgba(52,199,89,.15), transparent 70%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --karte: #1c1c1e; --text: #ffffff; --leise: rgba(235,235,245,.6); --trenner: rgba(84,84,88,.6); --blau: #0a84ff; --leer: #ff453a;
      --glas: rgba(58,58,62,.42); --glas-oben: rgba(255,255,255,.26); --glas-rand: rgba(255,255,255,.12);
      --hintergrund: radial-gradient(60% 50% at 10% 6%, rgba(10,132,255,.36), transparent 70%), radial-gradient(50% 45% at 92% 10%, rgba(191,90,242,.3), transparent 70%), radial-gradient(60% 50% at 75% 96%, rgba(48,209,88,.22), transparent 70%); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--hintergrund), var(--bg); background-attachment: fixed; color: var(--text); font: 15px/1.47 var(--schrift); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 360px; padding-top: env(safe-area-inset-top, 0px); text-align: center; animation: erscheinen .5s var(--feder); }
  .logo { display: block; width: 112px; height: 112px; margin: 0 auto 20px; border-radius: 26px; box-shadow: 0 0 0 .5px rgba(255,255,255,.25), 0 14px 40px rgba(0,0,0,.35), 0 0 36px rgba(0,229,255,.35); animation: logo-atmen 4s ease-in-out infinite; }
  @keyframes logo-atmen { 0%, 100% { box-shadow: 0 0 0 .5px rgba(255,255,255,.25), 0 14px 40px rgba(0,0,0,.35), 0 0 24px rgba(0,229,255,.25); } 50% { box-shadow: 0 0 0 .5px rgba(255,255,255,.3), 0 14px 40px rgba(0,0,0,.35), 0 0 52px rgba(0,229,255,.55); } }
  h1 { margin: 0 0 4px; font: 700 28px/1.15 var(--schrift); letter-spacing: -.022em; }
  p.unter { margin: 0 0 26px; color: var(--leise); }
  .gruppe { overflow: hidden; margin-bottom: 14px; border-radius: 16px; text-align: left;
    background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%), var(--glas); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8);
    box-shadow: inset 0 1px 0 var(--glas-oben), inset 0 0 0 .5px var(--glas-rand), 0 10px 34px rgba(30,45,90,.12); }
  .gruppe input { display: block; width: 100%; padding: 13px 16px; border: 0; outline: none; background: transparent; color: var(--text); font: 17px var(--schrift); letter-spacing: -.02em; }
  .gruppe input + input, .gruppe .bleiben { border-top: .5px solid var(--trenner); }
  .bleiben { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  .bleiben small { display: block; color: var(--leise); font-size: .8125rem; }
  .gruppe input.schalter { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 51px; height: 31px; padding: 0; border: 0; border-radius: 999px; background: var(--trenner); cursor: pointer; transition: background .25s var(--feder); }
  .gruppe input.schalter::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .3s var(--feder); }
  .gruppe input.schalter:checked { background: #34c759; }
  .gruppe input.schalter:checked::after { transform: translateX(20px); }
  .gruppe input::placeholder { color: var(--leise); }
  .gruppe:focus-within { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--blau) 40%, transparent); }
  button { width: 100%; padding: 13px 16px; border: 0; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 60%), var(--blau); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 22px color-mix(in srgb, var(--blau) 38%, transparent); color: #fff; font: 600 17px var(--schrift); letter-spacing: -.02em; cursor: pointer; transition: transform .12s var(--feder), opacity .15s; }
  button:active { transform: scale(.97); opacity: .9; }
  .fehler { margin: 0 0 14px; color: var(--leer); font-size: 14px; }
  @keyframes erscheinen { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { main, .logo { animation: none; } button { transition: none; } }
  @media (prefers-reduced-transparency: reduce) { body { background: var(--bg); } .gruppe { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--karte); } }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon-512.png?v=2" alt="Deadcliff" width="112" height="112">
  <h1>Claude Deck</h1>
  <p class="unter">Melde dich an, um fortzufahren.</p>
  <p class="fehler" id="fehler" hidden></p>
  <form method="post" action="/login">
    <div class="gruppe">
      <input type="password" name="password" placeholder="Passwort" autocomplete="current-password" autofocus required>
      <input type="text" name="code" placeholder="Code (nur bei Zwei-Faktor)" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <label class="bleiben"><span>Angemeldet bleiben<small>30 Tage statt 12 Stunden</small></span><input type="checkbox" name="bleiben" value="1" class="schalter"></label>
    </div>
    <button type="submit">Anmelden</button>
  </form>
</main>
<script>
  const f = new URLSearchParams(location.search).get("fehler");
  if (f) { const el = document.getElementById("fehler"); el.hidden = false; el.textContent = f === "gesperrt" ? "Zu viele Fehlversuche. Bitte später erneut versuchen." : "Passwort oder Code falsch."; }
</script>
</body>
</html>
